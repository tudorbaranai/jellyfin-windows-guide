name: Links

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".lycheeignore", ".github/workflows/links.yml"]
  schedule:
    - cron: "0 6 * * 1"   # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every link in the docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-retries 3 --accept 200,206,429 "./**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
